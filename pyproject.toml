[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topoqspr"
version = "1.0.0.dev0"
description = "Disease-anchored, provenance-tracked QSPR with verified graph-theoretic topological indices"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "rdkit>=2024.3",
  "chembl_structure_pipeline>=1.2",
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "requests>=2.31",
  "joblib>=1.3",     # imported directly (evaluate.py, pipeline.py), not only via scikit-learn
  "openpyxl>=3.1",   # expdata reads the Bradley melting-point source (mp_bradley, .xlsx)
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
test = ["pytest>=8", "httpx>=0.27", "networkx>=3.2", "mordredcommunity>=2.0"]
# kept for existing install commands; openpyxl is now a core dependency
expdata = ["openpyxl>=3.1"]

[project.scripts]
topoqspr = "topoqspr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-m "not network"'
markers = ["network: test needs live web services (deselect with -m 'not network')"]
